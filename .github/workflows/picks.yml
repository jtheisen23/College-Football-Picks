name: Weekly picks

# Runs the whole pipeline in GitHub's cloud and publishes the board to
# Pages, so nothing depends on a laptop being awake.
#
# Times are UTC. The schedule is built around a Saturday slate:
#   Tuesday    - first look once the week's lines are posted
#   Thursday   - refresh, and capture a second odds snapshot
#   Friday     - refresh again
#   Saturday   - final numbers a few hours before the early kickoffs
#
# Each run captures odds, which is what makes closing line value
# computable at all: CLV needs a line recorded later than the bet.
on:
  schedule:
    - cron: "0 15 * * 2"
    - cron: "0 15 * * 4"
    - cron: "0 15 * * 5"
    - cron: "0 13 * * 6"
  workflow_dispatch:
    inputs:
      week:
        description: "Week to publish (blank = current week)"
        required: false
        type: string
      season:
        description: "Season (blank = current season)"
        required: false
        type: string

concurrency:
  group: weekly-picks
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      # The database carries odds history, which is what CLV is measured
      # against. A fresh key each run with a shared prefix means the most
      # recent one is restored; losing it costs history, never correctness.
      #
      # The HTTP cache rides along because CFBD's free tier allows 1,000
      # requests a calendar month. A full run costs six (games, three
      # rating systems, lines, venues), so four runs a week is about 100
      # a month -- comfortable, but only while nothing loops per game.
      # Responses for finished seasons are cached forever, so a backtest
      # re-run costs nothing.
      - name: Restore database
        uses: actions/cache@v4
        with:
          path: |
            cfbpicks.sqlite
            data/cache
          # v2: the v1 cache holds demo games from before sample data was
          # made opt-in. Abandoning it is the only way to evict them --
          # fixture ratings are stored under the same source names as
          # real ones, so they cannot be deleted selectively.
          key: cfbpicks-db-v2-${{ github.run_id }}
          restore-keys: cfbpicks-db-v2-

      - name: Fetch, rate and publish
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SEASON: ${{ inputs.season }}
          WEEK: ${{ inputs.week }}
        run: |
          set -euo pipefail
          # if-blocks rather than `[ -n "$X" ] && ...`: under `set -e`
          # that form exits non-zero when the test fails and it happens
          # to be the step's last line, so it only breaks once someone
          # reorders the script. Not worth the trap.
          SEASON_ARG=""
          WEEK_ARG=""
          if [ -n "${SEASON:-}" ]; then SEASON_ARG="--season ${SEASON}"; fi
          if [ -n "${WEEK:-}" ]; then WEEK_ARG="--week ${WEEK}"; fi

          cfbpicks fetch ${SEASON_ARG} ${WEEK_ARG}
          cfbpicks rate ${SEASON_ARG}
          cfbpicks publish ${SEASON_ARG} ${WEEK_ARG}

      - name: Commit the board
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          # Nothing changed is a normal outcome, not a failure.
          if git diff --staged --quiet; then
            echo "No change to publish."
            exit 0
          fi
          git commit -m "Publish board ($(date -u '+%Y-%m-%d %H:%M UTC'))"

          # Someone pushing while a run is in flight must not throw away
          # the board it just spent minutes building. Rebase onto
          # whatever arrived and try again; the commit only touches
          # docs/, so it cannot conflict with ordinary work.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebasing onto the remote."
            git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
          done
          echo "::error::Could not push the board after three attempts."
          exit 1
