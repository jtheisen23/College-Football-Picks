[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfbpicks"
version = "0.1.0"
description = "College football predictions engine: ingests games, power ratings and sportsbook lines, then recommends bets with a quantified edge."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "requests>=2.31",
    "PyYAML>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
cfbpicks = "cfbpicks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cfbpicks = ["py.typed", "data/fixtures/*.json", "data/reference/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
